      truncated: false
  - id: A11
    source: brief.md
    text: A11：聊天消息支持头像、发送者元信息、现有标签和乐观发送；失败可恢复并显示错误，动画/触感遵守减少动画偏好。
    result: passed
    reason:
      text: Messages render avatar, sender, tags, and optimistic state; successful
        sends replace temporary messages and failures restore composer
        content/tags and show an error.
      truncated: false
  - id: A12
    source: brief.md
    text: A12：cloudflared 下载支持总超时/取消和同一 home 单飞，按官方源后显式 HTTPS 镜像顺序回退，日志不泄露完整镜像 URL。
    result: failed
    reason:
      text: "Close the singleflight cancellation race: after the last waiter aborts,
        the aborted SharedDownload remains in downloads until settlement, so a
        later non-aborted caller can attach to the already-aborted transaction
        instead of starting a fresh one; a pre-aborted first caller also starts
        background work."
      truncated: false
  - id: A13
    source: brief.md
    text: A13：cloudflared 响应流式写入唯一临时文件，小于 1 MiB、解压失败或 `--version`
