        retained value equals, and Unicode-whitespace rejection.
      truncated: false
  - id: A32
    source: specs/security-hardening/spec.md
    text: 登录门和代理分派前规范化并校验路径；编码、双编码、压平和未知 `/gateway` 变形路由必须 fail-closed，合法 Gateway
