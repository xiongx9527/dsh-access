        animations/transitions.
      truncated: false
  - id: A20
    source: specs/cloudflared-download-hardening/spec.md
    text: 优先使用 PATH 与既有有效缓存；缓存缺失时，同一 home 的并发调用复用一次下载事务。
    result: passed
    reason:
      text: ensureCloudflared validates PATH candidates first, falls through from
        invalid PATH entries to verified cache candidates, and active same-home
        callers share one downloads-map transaction.
      truncated: false
  - id: A21
    source: specs/cloudflared-download-hardening/spec.md
    text: 每次下载有总超时并传播调用方取消；响应体流式写入唯一临时文件，不把完整二进制缓冲在内存。
    result: failed
    reason:
      text: Response bytes are streamed rather than fully buffered, and caller waits
        are cancellable, but cancellation/timeout is only passed to fetch. Tar
        listing/extraction can run indefinitely after the 120-second deadline,
        and validation/rename can continue after the last waiter aborts, so
        timeout and caller cancellation are not propagated through the complete
        download transaction.
      truncated: false
  - id: A22
    source: specs/cloudflared-download-hardening/spec.md
    text: 下载顺序为 Cloudflare 官方源，其后为 `DSH_ACCESS_CLOUDFLARED_MIRRORS` 显式配置的 HTTPS
      镜像；不内置第三方代理，错误不回显完整 URL 或 query。
    result: passed
    reason:
      text: cloudflaredDownloadUrls places the official Cloudflare release first,
        admits only explicitly configured HTTPS mirrors afterward, and final
        source failures use generic labels rather than URL, host, or query
        details.
      truncated: false
  - id: A23
    source: specs/cloudflared-download-hardening/spec.md
    text: 每个来源失败后清理半截文件；小于 1 MiB 的下载视为无效。
    result: passed
    reason:
      text: Each source has a unique attempt directory removed in finally, stream
        failures remove partial destination files, and payloads below 1 MiB are
        rejected.
      truncated: false
  - id: A24
    source: specs/cloudflared-download-hardening/spec.md
    text: tgz 只解压到隔离临时目录；候选文件须通过类型、权限和 `cloudflared --version` 验证。
    result: passed
    reason:
      text: Archive names are checked for absolute, drive, backslash, and parent
        traversal forms; extraction targets an isolated directory, and the
        located candidate must be a regular executable that passes cloudflared
        --version.
      truncated: false
  - id: A25
    source: specs/cloudflared-download-hardening/spec.md
    text: 仅在全部验证通过后原子替换正式缓存；失败不得删除或破坏此前有效缓存。
    result: passed
    reason:
      text: The canonical executable is never moved aside before validation; a staged,
        fully probed candidate is renamed over it, while failed source attempts
        and invalid candidates leave the prior cache path untouched.
      truncated: false
  - id: A26
    source: specs/cloudflared-download-hardening/spec.md
    text: 不实现 Range 并发下载、动态 Homebrew bottle 发现、自动更新或独立公网 PIN。
    result: passed
    reason:
      text: No Range downloader, dynamic Homebrew discovery, automatic updater,
