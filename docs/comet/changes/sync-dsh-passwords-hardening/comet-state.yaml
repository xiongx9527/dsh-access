    text: A1：Cookie 名称精确匹配，只剥 ASCII space/tab，值中的 `=` 被保留；Unicode 空白伪造 Cookie
      不能认证，Gateway 与 Plugin 行为一致。
    result: passed
    reason:
      text: src/cookie.ts is shared by Gateway and Plugin, trims only ASCII space/tab,
        matches exact names, splits on the first '=', and preserves remaining
        '='; targeted Unicode-whitespace tests pass.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：编码、双编码、压平和未知 `/gateway` 变形路径不能绕过登录门或代理到上游；合法 Gateway API 与本机 3080 行为不变。
    result: failed
    reason:
      text: "Reject backslashes in raw gateway-like request targets before URL
        normalization: classifyGatewayRequestTarget returns upstream for
        absolute-form targets such as
        http://example.test\\gateway\\..\\api/session.list, while WHATWG parsing
        normalizes that target to /api/session.list for proxying."
      truncated: false
  - id: A3
    source: brief.md
    text: A3：session history 和聊天写入中的隐藏 Unicode、危险 HTML/CSS
      在模型输入边界被净化，普通文本、换行和数学比较符保留；文件 `read/raw/download` 保真。
    result: failed
    reason:
      text: "Expand the HTML-rewrite exclusion to every file download endpoint:
        shouldRewriteHtmlResponse currently returns true for GET
        /api/dsh-ssh/download with text/html, allowing INJECT_SCRIPT to modify
        downloaded HTML file bytes."
      truncated: false
  - id: A4
    source: brief.md
    text: A4：dsh-ssh 主机操作拒绝回环、私网、链路本地、未指定地址、IPv4 变体、mapped/compatible
      IPv6，以及任一解析结果为私网的 hostname；公网地址正常放行，DNS 失败时拒绝。
    result: passed
    reason:
      text: src/ssrf-policy.ts rejects private, loopback, link-local, unspecified,
        inet_aton, mapped/compatible IPv6, and unsafe DNS results; the gateway
        replaces an allowed hostname with its resolved public address.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：被过滤、净化或重新压缩的响应不同时发送 Content-Length 与 Transfer-Encoding，也不保留失效
      Content-Encoding；透明响应无回归。
    result: passed
    reason:
      text: Rewritten-body helpers remove stale Content-Length, Transfer-Encoding, and
        Content-Encoding, and compression emits a consistent encoding and
        explicit length.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：既有多用户架构继续保证 session ownership、workspace 响应隔离、sandbox 降级和权限撤销；本 change
      不增加平行 ownership 表或判断路径。
    result: passed
    reason:
      text: The diff adds no parallel ownership schema or authorization authority and
        retains the existing workspace/session filtering, sandbox, and
        active-connection revocation paths.
      truncated: false
  - id: A7
    source: brief.md
    text: A7：dsh rc.6/rc.7 下 slot 和 patch 状态判断正确；rc.7 缺少旧白名单时不误报 missing，可选
      workspace 目标缺失不阻塞核心补丁。
    result: passed
    reason:
      text: Stable slot keys are present, rc.6 whitelist augmentation is additive,
        rc.7 whitelist absence is treated as satisfied, and an absent optional
        workspace target does not block core patches.
      truncated: false
  - id: A8
    source: brief.md
    text: A8：workspace/session 搜索无结果可通过外部点击收起清空，浏览器自动填充不会污染搜索字段。
    result: passed
    reason:
      text: The optional workspace patch clears and collapses completed zero-result
