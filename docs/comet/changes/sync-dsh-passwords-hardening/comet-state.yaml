      truncated: false
  - id: A9
    source: brief.md
    text: A9：聊天轮询使用 since 增量且不重叠；空数据库建立稳定基线，数据库重置或 ID 回退后重建基线且不产生 phantom 未读。
    result: failed
    reason:
      text: "Reset the component's accumulated unread count when an epoch/ID reset
        begins: nextChatPollState returns unread 0, but ChatLauncher only adds
        positive unread values, so unread messages from the replaced database
        remain as a phantom badge."
      truncated: false
  - id: A10
    source: brief.md
    text: A10：聊天入口默认显示并可按当前账号隐藏/恢复，隐藏不删除消息；拖动位置按账号持久化且不误触打开。
