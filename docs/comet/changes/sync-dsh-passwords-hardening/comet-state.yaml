acceptance:
  - id: A1
    source: brief.md
    text: A1：Cookie 名称精确匹配，只剥 ASCII space/tab，值中的 `=` 被保留；Unicode 空白伪造 Cookie
      不能认证，Gateway 与 Plugin 行为一致。
    result: passed
    reason:
      text: src/cookie.ts is shared by Gateway and Plugin, strips only ASCII
        space/tab, matches the exact cookie name, splits at the first '=',
        preserves subsequent '=', and rejects Unicode-whitespace disguises.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：编码、双编码、压平和未知 `/gateway` 变形路径不能绕过登录门或代理到上游；合法 Gateway API 与本机 3080 行为不变。
    result: failed
    reason:
      text: src/gateway-path.ts still misses malformed absolute/network-path backslash
        targets. For example, http:////x\gateway\..\api/session.list and
        //x\gateway\..\api/session.list classify as upstream while WHATWG URL
        parsing normalizes them to /api/session.list, allowing a claimed gateway
        path to reach upstream dispatch.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：session history 和聊天写入中的隐藏 Unicode、危险 HTML/CSS
      在模型输入边界被净化，普通文本、换行和数学比较符保留；文件 `read/raw/download` 保真。
    result: failed
    reason:
      text: Chat writes and session.history are sanitized, and raw/read plus
        dsh-uploads/dsh-ssh downloads are excluded from HTML injection. However,
        permissions.ts identifies GET /api/session.export as a download surface
        while shouldRewriteHtmlResponse still returns true for that route when
        its response is text/html, so not all file-download responses are
        byte-preserving.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：dsh-ssh 主机操作拒绝回环、私网、链路本地、未指定地址、IPv4 变体、mapped/compatible
      IPv6，以及任一解析结果为私网的 hostname；公网地址正常放行，DNS 失败时拒绝。
    result: passed
    reason:
      text: src/ssrf-policy.ts handles inet_aton IPv4 forms, IPv6 mapped/compatible
        and NAT64 forms, private/loopback/link-local/unspecified ranges, mixed
        DNS answers, and DNS failure; gateway.ts rewrites an allowed hostname to
        its resolved public address.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：被过滤、净化或重新压缩的响应不同时发送 Content-Length 与 Transfer-Encoding，也不保留失效
      Content-Encoding；透明响应无回归。
    result: passed
    reason:
      text: headersForRewrittenBody removes stale Content-Length, Transfer-Encoding,
        and Content-Encoding, while compressResponseBody always removes
        Transfer-Encoding before assigning a replacement Content-Length or
        encoding.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：既有多用户架构继续保证 session ownership、workspace 响应隔离、sandbox 降级和权限撤销；本 change
      不增加平行 ownership 表或判断路径。
    result: passed
    reason:
      text: The diff retains the existing request-policy, workspace/session filtering,
        sandbox enforcement, and active-connection revocation mechanisms and
        introduces no parallel ownership table or authorization authority.
      truncated: false
  - id: A7
    source: brief.md
    text: A7：dsh rc.6/rc.7 下 slot 和 patch 状态判断正确；rc.7 缺少旧白名单时不误报 missing，可选
      workspace 目标缺失不阻塞核心补丁。
    result: passed
    reason:
      text: Stable slot keys are present, rc.6 whitelist patching is additive, rc.7
        whitelist absence is treated as satisfied, and a missing optional
        workspace target does not block core settings/host patches.
      truncated: false
  - id: A8
    source: brief.md
    text: A8：workspace/session 搜索无结果可通过外部点击收起清空，浏览器自动填充不会污染搜索字段。
    result: passed
    reason:
      text: The optional workspace patch clears and collapses completed zero-result
        searches after outside interaction and adds autocomplete="off" plus the
        noncredential dsh-access-session-search field name.
      truncated: false
  - id: A9
    source: brief.md
    text: A9：聊天轮询使用 since 增量且不重叠；空数据库建立稳定基线，数据库重置或 ID 回退后重建基线且不产生 phantom 未读。
    result: passed
    reason:
      text: Polling establishes a full baseline before using since, advances limited
        pages by the last delivered ID, prevents overlap with inFlight, detects
        epoch/ID rollback, rebuilds confirmed history, and now explicitly resets
        accumulated unread state.
      truncated: false
  - id: A10
    source: brief.md
    text: A10：聊天入口默认显示并可按当前账号隐藏/恢复，隐藏不删除消息；拖动位置按账号持久化且不误触打开。
    result: passed
    reason:
      text: Chat defaults enabled, persists visibility under chat_enabled:<user-id>
        without deleting messages, stores launcher position under
        dsh-access-chat-position:<user-id>, and suppresses opening after pointer
        movement.
      truncated: false
  - id: A11
    source: brief.md
    text: A11：聊天消息支持头像、发送者元信息、现有标签和乐观发送；失败可恢复并显示错误，动画/触感遵守减少动画偏好。
    result: passed
    reason:
      text: Chat renders avatars, sender metadata, timestamps and tags; optimistic
        sends are retained at the history cap, successful sends replace
        temporary entries, and failures restore content/tags and expose an
        error.
      truncated: false
  - id: A12
    source: brief.md
    text: A12：cloudflared 下载支持总超时/取消和同一 home 单飞，按官方源后显式 HTTPS 镜像顺序回退，日志不泄露完整镜像 URL。
    result: failed
    reason:
      text: "The pre-aborted and zero-waiter join races are repaired, but the
        advertised 120-second total timeout and shared cancellation do not cover
        the whole transaction: runTar has no signal or timeout, executable
        verification is not connected to the combined signal, and there is no
        combined.throwIfAborted() before rename. An aborted or timed-out
        transaction can therefore continue extracting, validating, and
        installing."
      truncated: false
  - id: A13
    source: brief.md
    text: A13：cloudflared 响应流式写入唯一临时文件，小于 1 MiB、解压失败或 `--version`
      验证失败均被清理；仅验证成功后原子替换，既有有效缓存不被失败下载破坏。
    result: passed
    reason:
      text: Network bodies stream to unique attempt files, undersized and invalid
        candidates are removed with their attempt directories, extraction is
        isolated, version probing precedes installation, and rename occurs only
        for a verified candidate.
      truncated: false
  - id: A14
    source: brief.md
    text: A14：认证、Admin/Guest、ownership、远程访问、3088/3080、WebSocket/SSE
      的现有测试无回归，完整测试与构建通过。
    result: passed
    reason:
      text: Reported runtime checks passed all 175 tests, the production build, diff
        and scope scans, and package-notice validation; existing authentication,
        ownership, remote-access, HTTP, WebSocket, and SSE regressions remain
        covered.
      truncated: false
  - id: A15
    source: specs/chat-experience/spec.md
    text: 聊天入口默认显示，并允许当前访问管理账号在设置中隐藏/恢复；偏好由服务端按账号保存，消息数据不删除。
    result: passed
    reason:
      text: The server-backed chat setting defaults true and is scoped by
