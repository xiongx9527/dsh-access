      truncated: false
  - id: A17
    source: specs/chat-experience/spec.md
    text: 消息气泡支持头像、发送者元信息、现有议题标签和乐观发送；发送失败恢复状态并显示错误。
    result: passed
    reason:
      text: Message cards include avatar, sender metadata and existing tags, while
        optimistic send success/failure paths replace or recover the temporary
