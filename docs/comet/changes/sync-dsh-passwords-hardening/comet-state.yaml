        read/raw/download routes remain outside the rewrite branch; sanitization
        tests preserve visible comparisons and line breaks.
      truncated: false
  - id: A34
    source: specs/security-hardening/spec.md
    text: dsh-ssh 主机地址按 socket 语义识别 IPv4/IPv6、inet_aton 变体和 mapped/compatible
