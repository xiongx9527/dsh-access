        leaves message rows intact.
      truncated: false
  - id: A16
    source: specs/chat-experience/spec.md
    text: 聊天气泡支持拖动，位置保存在按当前账号命名的本地 UI 偏好中；点击打开不能被拖动误触发。
    result: passed
    reason:
      text: Pointer movement updates launcher coordinates, persists them under an
