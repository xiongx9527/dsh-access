  - id: A39
    source: specs/workspace-session-experience/spec.md
    text: 聊天消息轮询在建立基线后使用 `since` 增量，同一时刻至多一个请求。
    result: passed
    reason:
      text: After baseline initialization pollUrl emits ?since=<lastSeenId>, while the
