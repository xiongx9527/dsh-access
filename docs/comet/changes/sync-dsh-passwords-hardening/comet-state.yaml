      truncated: false
  - id: A31
    source: specs/security-hardening/spec.md
    text: Gateway 与 Plugin 使用一致的 Cookie 解析：仅剥 ASCII space/tab，按第一个 `=`
      分割，名称精确匹配并保留值内其余 `=`；Unicode 空白不得参与认证。
    result: passed
    reason:
      text: Both Gateway and Plugin call the same readCookie implementation, which
