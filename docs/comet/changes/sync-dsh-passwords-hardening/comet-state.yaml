acceptance:
  - id: A1
    source: brief.md
    text: A1：Cookie 名称精确匹配，只剥 ASCII space/tab，值中的 `=` 被保留；Unicode 空白伪造 Cookie
      不能认证，Gateway 与 Plugin 行为一致。
    result: passed
    reason:
      text: src/cookie.ts implements shared exact-name, first-equals parsing with
        ASCII space/tab trimming only; Gateway and Plugin both import it, and
        cookie-hardening tests cover Unicode whitespace and embedded equals.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：编码、双编码、压平和未知 `/gateway` 变形路径不能绕过登录门或代理到上游；合法 Gateway API 与本机 3080 行为不变。
    result: passed
    reason:
      text: classifyGatewayRequestTarget runs before Gateway handlers and rejects
        encoded, double-encoded, flattened, malformed, unknown, and wrong-method
        /gateway targets; HTTP and WebSocket paths use it and targeted tests
        pass.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：session history 和聊天写入中的隐藏 Unicode、危险 HTML/CSS
      在模型输入边界被净化，普通文本、换行和数学比较符保留；文件 `read/raw/download` 保真。
    result: passed
    reason:
      text: Chat writes use sanitizeText and session.history recursively sanitizes
        strings; ordinary line breaks/comparisons are tested, while
        read/raw/download routes are not rewritten.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：dsh-ssh 主机操作拒绝回环、私网、链路本地、未指定地址、IPv4 变体、mapped/compatible
      IPv6，以及任一解析结果为私网的 hostname；公网地址正常放行，DNS 失败时拒绝。
    result: passed
    reason:
      text: ssrf-policy parses inet_aton IPv4 forms, IPv6 mapped/compatible/NAT64
        forms, private/link-local/unspecified ranges, and rejects failed, empty,
        or mixed-private DNS answers; Gateway rewrites an allowed hostname to
        its resolved public address.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：被过滤、净化或重新压缩的响应不同时发送 Content-Length 与 Transfer-Encoding，也不保留失效
      Content-Encoding；透明响应无回归。
    result: passed
    reason:
      text: headersForRewrittenBody removes stale framing/encoding headers and
        compressResponseBody always removes Transfer-Encoding before assigning
        Content-Length; compression tests cover the invalid combinations and
        Runtime tests passed.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：既有多用户架构继续保证 session ownership、workspace 响应隔离、sandbox 降级和权限撤销；本 change
      不增加平行 ownership 表或判断路径。
    result: passed
    reason:
      text: The diff adds no ownership table or parallel authorization mechanism and
        retains the existing workspace filtering, session-scoped checks, sandbox
        enforcement, and connection revocation paths; the capability-boundary
        scan and full regressions passed.
      truncated: false
  - id: A7
    source: brief.md
    text: A7：dsh rc.6/rc.7 下 slot 和 patch 状态判断正确；rc.7 缺少旧白名单时不误报 missing，可选
      workspace 目标缺失不阻塞核心补丁。
    result: passed
    reason:
      text: Slot registrations now carry stable keys, rc.6 whitelist patching
        preserves existing namespaces, rc.7 absence of WEB_SETTINGS_NAMESPACES
        is treated as satisfied, and an absent optional workspace target does
        not block core patching.
      truncated: false
  - id: A8
    source: brief.md
    text: A8：workspace/session 搜索无结果可通过外部点击收起清空，浏览器自动填充不会污染搜索字段。
    result: passed
    reason:
      text: The optional workspace patch clears and collapses a nonempty no-result
        search on outside interaction and adds autocomplete=off with a dedicated
        noncredential field name; rc compatibility tests exercise patching and
        rollback.
      truncated: false
  - id: A9
    source: brief.md
    text: A9：聊天轮询使用 since 增量且不重叠；空数据库建立稳定基线，数据库重置或 ID 回退后重建基线且不产生 phantom 未读。
    result: passed
    reason:
      text: Chat polling uses since cursors, an inFlight guard prevents overlap, and
        state transitions cover empty baselines, epoch changes, ID rollback,
        incremental paging, and phantom-unread suppression.
      truncated: false
  - id: A10
    source: brief.md
    text: A10：聊天入口默认显示并可按当前账号隐藏/恢复，隐藏不删除消息；拖动位置按账号持久化且不误触打开。
    result: failed
    reason:
      text: "Make chat preference changes propagate to ChatLauncher immediately:
        AccessManagementSection updates only its own state/server setting, while
        ChatLauncher fetches the preference only once, so hiding or restoring
        requires a remount/reload."
      truncated: false
  - id: A11
    source: brief.md
    text: A11：聊天消息支持头像、发送者元信息、现有标签和乐观发送；失败可恢复并显示错误，动画/触感遵守减少动画偏好。
    result: failed
    reason:
      text: "Preserve optimistic messages when the history already contains 200 items:
        mergeById sorts the negative temporary ID first and slice(-200)
        immediately discards it, so the required optimistic bubble is not
        rendered at the configured cap."
      truncated: false
  - id: A12
    source: brief.md
    text: A12：cloudflared 下载支持总超时/取消和同一 home 单飞，按官方源后显式 HTTPS 镜像顺序回退，日志不泄露完整镜像 URL。
    result: failed
    reason:
      text: "Honor every caller's AbortSignal during same-home singleflight:
        withCloudflaredDownload returns an existing promise without observing a
        later caller's signal, so that caller cannot cancel its wait and
        cancellation semantics depend solely on the first caller."
      truncated: false
  - id: A13
    source: brief.md
    text: A13：cloudflared 响应流式写入唯一临时文件，小于 1 MiB、解压失败或 `--version`
      验证失败均被清理；仅验证成功后原子替换，既有有效缓存不被失败下载破坏。
    result: failed
    reason:
      text: "Implement an actual atomic cache replacement: replaceExecutable first
        renames the existing executable to a backup and only then renames the
        candidate, leaving a crash window with no canonical executable rather
        than atomically replacing it."
      truncated: false
  - id: A14
    source: brief.md
    text: A14：认证、Admin/Guest、ownership、远程访问、3088/3080、WebSocket/SSE
      的现有测试无回归，完整测试与构建通过。
    result: passed
    reason:
      text: Runtime evidence shows npm test passed 166/166, production build passed,
        git diff --check passed, capability-boundary scan passed, and the
        corrected package-notice-v2 check passed.
      truncated: false
  - id: A15
    source: specs/chat-experience/spec.md
    text: 聊天入口默认显示，并允许当前访问管理账号在设置中隐藏/恢复；偏好由服务端按账号保存，消息数据不删除。
    result: failed
    reason:
      text: Synchronize the server-backed per-account preference with the mounted
        launcher; the settings checkbox currently cannot hide or restore
        ChatLauncher until its one-time preference effect runs again after
        remount/reload.
      truncated: false
  - id: A16
    source: specs/chat-experience/spec.md
    text: 聊天气泡支持拖动，位置保存在按当前账号命名的本地 UI 偏好中；点击打开不能被拖动误触发。
    result: passed
    reason:
      text: Pointer drag state suppresses click opening after movement and persists
        coordinates under dsh-access-chat-position:<account-id> in localStorage;
        targeted UI tests cover these paths.
      truncated: false
  - id: A17
    source: specs/chat-experience/spec.md
    text: 消息气泡支持头像、发送者元信息、现有议题标签和乐观发送；发送失败恢复状态并显示错误。
    result: failed
    reason:
      text: "Fix capped-history optimistic rendering: with 200 prior messages, the
        negative temporary message is removed by sorted slice(-200), despite the
        source containing recovery/error handling for other send failures."
      truncated: false
  - id: A18
    source: specs/chat-experience/spec.md
    text: 保留 dsh-access 现有账号权限、消息 API、未读统计和移动端 safe-area/抽屉适配。
    result: passed
    reason:
      text: Authenticated message visibility, sender filtering, unread handling,
        existing tags, and mobile safe-area styles remain present; full account,
        API, mobile, and connection regressions passed.
      truncated: false
  - id: A19
    source: specs/chat-experience/spec.md
    text: 触感反馈和动画仅作渐进增强，并遵守 `prefers-reduced-motion`。
    result: passed
    reason:
      text: Haptics are feature-detected and skipped under prefers-reduced-motion, and
        the reduced-motion media rule disables launcher, panel, backdrop, and
        message animations/transitions.
      truncated: false
  - id: A20
    source: specs/cloudflared-download-hardening/spec.md
    text: 优先使用 PATH 与既有有效缓存；缓存缺失时，同一 home 的并发调用复用一次下载事务。
    result: passed
    reason:
      text: ensureCloudflared verifies and prioritizes an executable PATH candidate,
        then verified cache candidates, and same-home calls share the downloads
        map transaction; targeted tests cover priority, invalid PATH entries,
        cache reuse, and singleflight.
      truncated: false
  - id: A21
    source: specs/cloudflared-download-hardening/spec.md
    text: 每次下载有总超时并传播调用方取消；响应体流式写入唯一临时文件，不把完整二进制缓冲在内存。
    result: failed
    reason:
      text: "Propagate cancellation for concurrent callers individually: once a
        same-home transaction exists, withCloudflaredDownload ignores the new
        call's AbortSignal even though the first transaction's fetch is streamed
        and timeout-bound."
      truncated: false
  - id: A22
    source: specs/cloudflared-download-hardening/spec.md
    text: 下载顺序为 Cloudflare 官方源，其后为 `DSH_ACCESS_CLOUDFLARED_MIRRORS` 显式配置的 HTTPS
      镜像；不内置第三方代理，错误不回显完整 URL 或 query。
    result: passed
    reason:
      text: Download URLs always begin with the official Cloudflare HTTPS release and
        append only explicitly configured HTTPS mirrors; errors use source
        labels and generic validation messages without URL/query disclosure.
      truncated: false
  - id: A23
    source: specs/cloudflared-download-hardening/spec.md
    text: 每个来源失败后清理半截文件；小于 1 MiB 的下载视为无效。
    result: passed
    reason:
      text: Each source uses an isolated attempt directory removed in finally, stream
        failures remove the partial file, and payloads smaller than 1 MiB are
        rejected and cleaned; targeted stream tests pass.
      truncated: false
  - id: A24
    source: specs/cloudflared-download-hardening/spec.md
    text: tgz 只解压到隔离临时目录；候选文件须通过类型、权限和 `cloudflared --version` 验证。
    result: passed
    reason:
      text: tgz files are listed for unsafe paths and extracted only into a
        transaction directory; the selected candidate must be a regular file,
        receives executable permissions, and passes cloudflared --version before
        installation.
      truncated: false
  - id: A25
    source: specs/cloudflared-download-hardening/spec.md
    text: 仅在全部验证通过后原子替换正式缓存；失败不得删除或破坏此前有效缓存。
    result: failed
    reason:
      text: Replace the verified candidate with a true atomic overwrite of the
        canonical cache path; the current old-to-backup then
        candidate-to-canonical sequence has an interruption window where the
        valid cache is absent.
      truncated: false
  - id: A26
    source: specs/cloudflared-download-hardening/spec.md
    text: 不实现 Range 并发下载、动态 Homebrew bottle 发现、自动更新或独立公网 PIN。
    result: passed
    reason:
      text: The implementation contains no Range downloader, dynamic Homebrew bottle
        discovery, automatic updater, independent public PIN, or built-in
        third-party proxy; the forbidden-capability scan passed.
      truncated: false
  - id: A27
    source: specs/dsh-rc7-compat/spec.md
    text: slot 注册提供新版要求的稳定 key，同时保持 rc.6 行为。
    result: passed
    reason:
      text: Settings, account, overlay, chat, and token slot registrations provide
