      truncated: false
  - id: A30
    source: specs/dsh-rc7-compat/spec.md
    text: workspace 搜索粘滞态和自动填充补丁为可选补丁；目标文件不存在时不阻塞核心 host/settings 补丁。
    result: passed
    reason:
      text: Workspace search/autofill changes run only when the optional target
