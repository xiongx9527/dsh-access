      truncated: false
  - id: A40
    source: specs/workspace-session-experience/spec.md
    text: 空数据库建立稳定基线；数据库重置或 ID 回退时只重新建立基线，不产生未读幻觉。
    result: passed
    reason:
      text: Empty databases establish cursor zero without unread; latest-ID rollback
