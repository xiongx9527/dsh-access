      truncated: false
  - id: A19
    source: specs/chat-experience/spec.md
    text: 触感反馈和动画仅作渐进增强，并遵守 `prefers-reduced-motion`。
    result: passed
    reason:
      text: Haptics are feature-detected and skipped under prefers-reduced-motion; the
