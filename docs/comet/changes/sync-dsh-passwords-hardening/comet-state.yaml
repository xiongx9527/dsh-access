      truncated: false
  - id: A29
    source: specs/dsh-rc7-compat/spec.md
    text: rc.7 缺少旧 namespace 白名单时，状态视为已满足而不是 missing。
    result: passed
    reason:
      text: patchStatus sets whitelist=true when WEB_SETTINGS_NAMESPACES is absent,
