      truncated: false
  - id: A28
    source: specs/dsh-rc7-compat/spec.md
    text: settings/whitelist 补丁探测 rc.6 的 `WEB_SETTINGS_NAMESPACES` 和 rc.7 移除该常量两种结构。
    result: passed
    reason:
      text: whitelistPatchApplicable explicitly distinguishes rc.6
