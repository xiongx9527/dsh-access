      truncated: false
  - id: A18
    source: specs/chat-experience/spec.md
    text: 保留 dsh-access 现有账号权限、消息 API、未读统计和移动端 safe-area/抽屉适配。
    result: passed
    reason:
      text: Existing authenticated message APIs and account filtering remain in use,
        database-reset transitions now call setUnread(0), and the chat CSS
